// ===== SETTINGS =====
var SETTINGS_KEY = 'kcna_settings';
function getSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || { timer:false, shuffle:false, weighted:false, weakOnly:false }; } catch(e) { return { timer:false, shuffle:false, weighted:false, weakOnly:false }; }
}
function saveSettings(s) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch(e) {} }
function toggleSetting(key) {
  var s = getSettings();
  s[key] = !s[key];
  saveSettings(s);
  render();
}

// ===== STATE =====
var state = { view:'home', currentRound:null, questions:[], answers:{}, notes:{}, lastAttempt:null, startTime:null, timerInterval:null, timeElapsed:0, isMock:false };

// ===== STORAGE =====
function getAttempts() { try { return JSON.parse(localStorage.getItem('kcna_attempts')) || []; } catch(e) { return []; } }
function saveAttempt(a) {
  try {
    var list = getAttempts();
    list.push(a);
    localStorage.setItem('kcna_attempts', JSON.stringify(list));
  } catch(e) {}
}
function getWeak() { try { return JSON.parse(localStorage.getItem('kcna_weak')) || {}; } catch(e) { return {}; } }
function getNotes() { try { return JSON.parse(localStorage.getItem('kcna_notes')) || {}; } catch(e) { return {}; } }
function saveNote(qNum, text) {
  var n = getNotes();
  if (text.trim() === '') delete n[qNum]; else n[qNum] = text;
  try { localStorage.setItem('kcna_notes', JSON.stringify(n)); } catch(e) {}
}
function clearAll() {
  try {
    localStorage.removeItem('kcna_attempts');
    localStorage.removeItem('kcna_weak');
    localStorage.removeItem('kcna_notes');
    localStorage.removeItem(SETTINGS_KEY);
  } catch(e) {}
}

// ===== WEIGHTED PICK =====
function domainWeight(domain) {
  if (domain === 'K8s Fundamentals') return 44;
  if (domain === 'Container Orchestration') return 28;
  if (domain === 'Cloud Native App Delivery') return 16;
  if (domain === 'Cloud Native Architecture') return 12;
  return 10;
}
function pickWeighted(count, weakOnly) {
  var pool = QUESTIONS.slice();
  if (weakOnly) {
    var weak = getWeak();
    var weakNums = Object.keys(weak).map(function(k){ return parseInt(k); });
    pool = pool.filter(function(q){ return weakNums.indexOf(q.q) !== -1; });
    if (pool.length < count) pool = QUESTIONS.slice();
  }
  var weighted = [];
  pool.forEach(function(q){ weighted.push({ q:q, w: domainWeight(q.domain) }); });
  var picked = [];
  while (picked.length < count && weighted.length > 0) {
    var totalW = weighted.reduce(function(s,x){ return s + x.w; }, 0);
    var r = Math.random() * totalW;
    var acc = 0;
    for (var i = 0; i < weighted.length; i++) {
      acc += weighted[i].w;
      if (r <= acc) {
        picked.push(weighted[i].q);
        weighted.splice(i, 1);
        break;
      }
    }
  }
  return picked;
}
function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ===== TIMER =====
function startTimer() {
  state.startTime = Date.now();
  state.timeElapsed = 0;
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(function() {
    state.timeElapsed = Math.floor((Date.now() - state.startTime) / 1000);
    var el = document.getElementById('timerDisplay');
    if (el) {
      var m = Math.floor(state.timeElapsed / 60);
      var s = state.timeElapsed % 60;
      el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      if (state.timeElapsed > 900) el.classList.add('warning');
    }
  }, 1000);
}
function stopTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  state.timeElapsed = Math.floor((Date.now() - state.startTime) / 1000);
}

// ===== RENDER =====
function render() {
  var app = document.getElementById('app');
  if (state.view === 'home') app.innerHTML = homeView();
  else if (state.view === 'quiz') app.innerHTML = quizView();
  else if (state.view === 'results') app.innerHTML = resultsView();
  else if (state.view === 'history') app.innerHTML = historyView();
  else if (state.view === 'weak') app.innerHTML = weakView();
  else if (state.view === 'notes') app.innerHTML = notesView();
  window.scrollTo(0, 0);
}

function homeView() {
  var attempts = getAttempts();
  var s = getSettings();
  var html = '<h1>KCNA Tracker</h1>';
  html += '<div class="subtitle">LFS250 Practice — 120 questions</div>';
  html += '<h2>Settings</h2>';
  html += '<div class="toggle-row"><span>⏱ Timer (90 sec/question)</span><label class="toggle"><input type="checkbox" ' + (s.timer?'checked':'') + ' onchange="toggleSetting(\'timer\')"><span class="slider"></span></label></div>';
  html += '<div class="toggle-row"><span>🔀 Shuffle within round</span><label class="toggle"><input type="checkbox" ' + (s.shuffle?'checked':'') + ' onchange="toggleSetting(\'shuffle\')"><span class="slider"></span></label></div>';
  html += '<div class="toggle-row"><span>⚖️ Weighted random (exam distribution)</span><label class="toggle"><input type="checkbox" ' + (s.weighted?'checked':'') + ' onchange="toggleSetting(\'weighted\')"><span class="slider"></span></label></div>';
  html += '<div class="toggle-row"><span>🎯 Weak-only mode</span><label class="toggle"><input type="checkbox" ' + (s.weakOnly?'checked':'') + ' onchange="toggleSetting(\'weakOnly\')"><span class="slider"></span></label></div>';
  html += '<h2>Practice</h2>';
  html += '<button class="menu-btn" onclick="startMockExam()">📝 Mock Exam (60 Qs)</button>';
  for (var r = 1; r <= 12; r++) {
    var roundAttempts = attempts.filter(function(a){ return a.round === r; });
    var best = roundAttempts.length > 0 ? Math.max.apply(null, roundAttempts.map(function(a){ return a.score; })) : null;
    var total = QUESTIONS.filter(function(q){ return q.round === r; }).length;
    var badge = best !== null ? '<span class="badge">' + best + '/' + total + '</span>' : '';
    html += '<button class="menu-btn" onclick="startRound(' + r + ')">Round ' + r + ' ' + badge + '</button>';
  }
  html += '<h2>Progress</h2>';
  html += '<button class="menu-btn" onclick="state.view=\'history\';render();">📊 View History</button>';
  html += '<button class="menu-btn" onclick="state.view=\'weak\';render();">🎯 Weak Topics</button>';
  html += '<button class="menu-btn" onclick="state.view=\'notes\';render();">📝 My Notes</button>';
  html += '<button class="menu-btn" onclick="exportNotes()">📤 Export Study Guide</button>';
  html += '<h2>Reset</h2>';
  html += '<button class="btn btn-danger" onclick="if(confirm(\'Delete ALL progress?\')){clearAll();render();}">Clear All Data</button>';
  return html;
}

function startRound(n) {
  var s = getSettings();
  var qs = QUESTIONS.filter(function(q){ return q.round === n; });
  if (s.weighted) {
    qs = pickWeighted(qs.length, s.weakOnly);
  } else if (s.shuffle) {
    qs = shuffleArray(qs);
  }
  state.view = 'quiz';
  state.currentRound = n;
  state.isMock = false;
  state.questions = qs;
  state.answers = {};
  state.notes = {};
  if (s.timer) startTimer(); else stopTimer();
  render();
}

function startMockExam() {
  var qs = pickWeighted(60, false);
  state.view = 'quiz';
  state.currentRound = 'MOCK';
  state.isMock = true;
  state.questions = qs;
  state.answers = {};
  state.notes = {};
  startTimer();
  render();
}

function quizView() {
  var s = getSettings();
  var html = '<div class="header">';
  html += '<button class="back-btn" onclick="if(confirm(\'Leave?\')){stopTimer();state.view=\'home\';render();}">← Back</button>';
  html += '<strong>' + (state.isMock ? 'Mock Exam' : 'Round ' + state.currentRound) + '</strong>';
  if (s.timer || state.isMock) html += '<span class="timer-display" id="timerDisplay">00:00</span>';
  html += '</div>';
  state.questions.forEach(function(q){
    html += '<div class="question">';
    html += '<span class="domain-tag">' + q.domain + '</span>';
    html += '<h3>Q' + q.q + '. ' + q.text + '</h3>';
    Object.keys(q.options).forEach(function(k){
      var sel = state.answers[q.q] === k ? 'selected' : '';
      var chk = state.answers[q.q] === k ? 'checked' : '';
      html += '<label class="' + sel + '" onclick="pick(' + q.q + ',\'' + k + '\',this)">';
      html += '<input type="radio" name="q' + q.q + '" ' + chk + '> ' + k + '. ' + q.options[k];
      html += '</label>';
    });
    html += '</div>';
  });
  html += '<button class="btn" onclick="submitRound()">Submit</button>';
  return html;
}

function pick(qNum, val, el) {
  state.answers[qNum] = val;
  var parent = el.parentElement;
  var labels = parent.querySelectorAll('label');
  for (var i = 0; i < labels.length; i++) labels[i].classList.remove('selected');
  el.classList.add('selected');
}

function submitRound() {
  stopTimer();
  var qs = state.questions;
  var score = 0;
  var domainStats = {};
  var missed = [];
  var review = '';
  var existingNotes = getNotes();

  qs.forEach(function(q){
    var userAns = state.answers[q.q] || 'No answer';
    var ok = userAns === q.correct;
    if (!domainStats[q.domain]) domainStats[q.domain] = { correct:0, total:0 };
    domainStats[q.domain].total++;
    if (ok) { score++; domainStats[q.domain].correct++; }
    else { missed.push({ q:q.q, text:q.text, page:q.page, domain:q.domain, correct:q.correct }); }

    review += '<div class="review-item ' + (ok?'correct':'wrong') + '">';
    review += '<div class="label">Q' + q.q + ' — ' + (ok?'✅ Correct':'❌ Wrong') + '</div>';
    review += '<div style="margin-top:6px;font-weight:600;">' + q.text + '</div>';
    review += '<div style="margin-top:8px;font-size:14px;">Your answer: ' + userAns + ' · Correct: ' + q.correct + '</div>';
    review += '<div class="explanation"><strong>Explanation:</strong> ' + q.explanation + '<br><strong>Page:</strong> ' + q.page + '</div>';
    if (!ok) {
      var existing = existingNotes[q.q] || '';
      review += '<div class="note-box"><textarea placeholder="Write your study note for this question..." id="note_' + q.q + '" onchange="saveNote(' + q.q + ', this.value)">' + existing.replace(/</g,'&lt;') + '</textarea></div>';
    }
    review += '</div>';
  });

  var attempt = {
    round: state.currentRound,
    date: new Date().toISOString(),
    score: score,
    total: qs.length,
    timeElapsed: state.timeElapsed,
    domainStats: domainStats,
    missed: missed,
    review: review
  };
  saveAttempt(attempt);

  var weak = getWeak();
  missed.forEach(function(m){ weak[m.q] = (weak[m.q]||0)+1; });
  try { localStorage.setItem('kcna_weak', JSON.stringify(weak)); } catch(e) {}

  state.view = 'results';
  state.lastAttempt = attempt;
  render();
}

function resultsView() {
  var a = state.lastAttempt;
  var pct = Math.round((a.score/a.total)*100);
  var passed = pct >= 75;
  var mins = Math.floor(a.timeElapsed / 60);
  var secs = a.timeElapsed % 60;
  var timeStr = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  var avgSec = a.total > 0 ? Math.round(a.timeElapsed / a.total) : 0;
  var html = '<div class="results">';
  html += '<h2>' + (a.round === 'MOCK' ? 'Mock Exam' : 'Round ' + a.round) + ' Results</h2>';
  html += '<div class="score-box ' + (passed?'pass':'fail') + '">' + a.score + ' / ' + a.total + ' (' + pct + '%)</div>';
  html += '<div style="text-align:center;font-size:14px;color:#666;margin-bottom:20px;">Time: ' + timeStr + ' · Avg ' + avgSec + 's per question</div>';
  html += '<div style="text-align:center;font-size:16px;color:#666;margin-bottom:20px;">' + (passed ? '✅ PASS' : '❌ BELOW PASS') + '</div>';
  html += '<h3>Domain Breakdown</h3>';
  Object.keys(a.domainStats).forEach(function(d){
    var s = a.domainStats[d];
    var dpct = Math.round((s.correct/s.total)*100);
    html += '<div class="domain-row"><span>' + d + '</span><span><strong>' + s.correct + '/' + s.total + '</strong> (' + dpct + '%)</span></div>';
  });
  html += '<div class="focus-list"><h3>🎯 Where to Focus</h3>';
  if (a.missed.length === 0) {
    html += '<p>Perfect. Move on.</p>';
  } else {
    html += '<ul>';
    a.missed.forEach(function(m){
      html += '<li><strong>Q' + m.q + '</strong> — ' + m.text + '<br><span style="color:#666;font-size:13px;">Page ' + m.page + '</span></li>';
    });
    html += '</ul>';
  }
  html += '</div>';
  html += '<h3 style="margin-top:24px;">Review + Notes</h3>';
  html += a.review;
  html += '<button class="btn" onclick="state.view=\'home\';render();">← Home</button>';
  html += '</div>';
  return html;
}

function historyView() {
  var attempts = getAttempts();
  var html = '<div class="header"><button class="back-btn" onclick="state.view=\'home\';render();">← Back</button><strong>History</strong><span></span></div>';
  if (attempts.length === 0) {
    html += '<div class="empty">No attempts yet.</div>';
  } else {
    for (var r = 1; r <= 12; r++) {
      var roundAttempts = attempts.filter(function(a){ return a.round === r; });
      if (roundAttempts.length === 0) continue;
      html += '<h2>Round ' + r + '</h2>';
      roundAttempts.forEach(function(a){
        var pct = Math.round((a.score/a.total)*100);
        var d = new Date(a.date).toLocaleString();
        html += '<div class="history-item"><div><div class="date">' + d + '</div>';
        html += '<div class="score ' + (pct>=75?'pass':'fail') + '">' + a.score + '/' + a.total + ' (' + pct + '%)</div></div>';
        html += '<div style="font-size:13px;color:#666;">' + a.missed.length + ' missed</div></div>';
      });
    }
    var mockAttempts = attempts.filter(function(a){ return a.round === 'MOCK'; });
    if (mockAttempts.length > 0) {
      html += '<h2>Mock Exams</h2>';
      mockAttempts.forEach(function(a){
        var pct = Math.round((a.score/a.total)*100);
        var d = new Date(a.date).toLocaleString();
        html += '<div class="history-item"><div><div class="date">' + d + '</div>';
        html += '<div class="score ' + (pct>=75?'pass':'fail') + '">' + a.score + '/' + a.total + ' (' + pct + '%)</div></div>';
        html += '<div style="font-size:13px;color:#666;">' + a.missed.length + ' missed</div></div>';
      });
    }
  }
  return html;
}

function weakView() {
  var weak = getWeak();
  var entries = Object.keys(weak).map(function(k){ return [k, weak[k]]; }).sort(function(a,b){ return b[1] - a[1]; });
  var html = '<div class="header"><button class="back-btn" onclick="state.view=\'home\';render();">← Back</button><strong>Weak Topics</strong><span></span></div>';
  if (entries.length === 0) {
    html += '<div class="empty">No weak topics yet.</div>';
  } else {
    entries.forEach(function(entry){
      var qNum = entry[0]; var count = entry[1];
      var q = null;
      for (var i = 0; i < QUESTIONS.length; i++) { if (QUESTIONS[i].q === parseInt(qNum)) { q = QUESTIONS[i]; break; } }
      if (!q) return;
      html += '<div class="weak-topic">';
      html += '<div><strong>Q' + q.q + '</strong> — ' + q.text + '</div>';
      html += '<div style="margin-top:6px;font-size:13px;"><span class="count">Missed ' + count + '×</span> · Page ' + q.page + ' · ' + q.domain + '</div>';
      html += '<div style="margin-top:6px;font-size:13px;color:#28a745;">Correct: <strong>' + q.correct + '</strong></div>';
      html += '</div>';
    });
  }
  return html;
}

function notesView() {
  var notes = getNotes();
  var keys = Object.keys(notes);
  var html = '<div class="header"><button class="back-btn" onclick="state.view=\'home\';render();">← Back</button><strong>My Notes</strong><span></span></div>';
  if (keys.length === 0) {
    html += '<div class="empty">No notes yet. Take a round and write notes on questions you miss.</div>';
  } else {
    keys.sort(function(a,b){ return parseInt(a) - parseInt(b); });
    keys.forEach(function(qNum){
      var q = null;
      for (var i = 0; i < QUESTIONS.length; i++) { if (QUESTIONS[i].q === parseInt(qNum)) { q = QUESTIONS[i]; break; } }
      if (!q) return;
      html += '<div class="weak-topic" style="background:#eef3ff;border-left:4px solid #326ce5;">';
      html += '<div><strong>Q' + q.q + '</strong> — ' + q.text + '</div>';
      html += '<div style="margin-top:6px;font-size:13px;color:#666;">Page ' + q.page + ' · Correct: ' + q.correct + '</div>';
      html += '<div style="margin-top:8px;font-size:14px;white-space:pre-wrap;">' + notes[qNum].replace(/</g,'&lt;') + '</div>';
      html += '</div>';
    });
  }
  return html;
}

function exportNotes() {
  var notes = getNotes();
  var weak = getWeak();
  var text = 'KCNA STUDY GUIDE\nGenerated: ' + new Date().toLocaleString() + '\n\n';
  var keys = Object.keys(notes);
  if (keys.length === 0) {
    text += 'No notes written yet.\n';
  } else {
    keys.sort(function(a,b){ return parseInt(a) - parseInt(b); });
    keys.forEach(function(qNum){
      var q = null;
      for (var i = 0; i < QUESTIONS.length; i++) { if (QUESTIONS[i].q === parseInt(qNum)) { q = QUESTIONS[i]; break; } }
      if (!q) return;
      var missed = weak[qNum] || 0;
      text += '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
      text += 'Q' + q.q + ': ' + q.text + '\n';
      text += 'Domain: ' + q.domain + ' | Page ' + q.page + ' | Missed ' + missed + '×\n\n';
      text += 'MY NOTE:\n' + notes[qNum] + '\n\n';
      text += 'CORRECT ANSWER: ' + q.correct + ') ' + q.options[q.correct] + '\n\n';
    });
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){
      alert('Study guide copied to clipboard! Paste into Notes app or email.');
    }).catch(function(){
      showExportFallback(text);
    });
  } else {
    showExportFallback(text);
  }
}

function showExportFallback(text) {
  var w = window.open('', '_blank');
  if (w) {
    w.document.write('<pre style="font-family:monospace;white-space:pre-wrap;padding:20px;">' + text.replace(/</g,'&lt;') + '</pre>');
    w.document.title = 'KCNA Study Guide';
  } else {
    alert('Could not open export. Please allow pop-ups.');
  }
}

// ===== BOOT =====
render();
</script>
</body>
</html>
